# Run UI + worker locally for testing.
# Usage (from repo root): docker compose -f fbxify/docker/docker-compose.yml up --build
# Or: run_ui_worker.bat / run_ui_worker.sh (loads docker-build.config, sets CHECKPOINTS_DIR)
# RUN_WITH_LOCAL=1 in config: run scripts merge docker-compose.local.yml to mount local repo over /fbxify
#
# Requirements:
# - GPU (worker)
# - Checkpoints at CHECKPOINTS_DIR/sam-3d-body-vith (default: repo-root/checkpoints)
#
# CHECKPOINTS_DIR = host path for volume. CHECKPOINTS_DIR_CONTAINER = container path (where app looks).
# CACHE_DIR = host path for volume. CACHE_DIR_CONTAINER = container path (default /fbxify/cache).
# For HF_TOKEN auto-download of missing checkpoints, remove :ro from the checkpoints volume and set HF_TOKEN.
#
# Optional auth: FBXIFY_SHARED_SECRET for worker API. REQUIRE_AUTH=1 + FBXIFY_AUTH_CREDENTIALS=user:pass,... for Gradio login.
#
# Open http://localhost:7444 for the Gradio UI (or UI_PORT if set, e.g. when 7444 is in use).

services:
  worker:
    image: mordommin94/fbxify-worker:latest
    build:
      context: ../..
      dockerfile: fbxify/docker/Dockerfile.worker
      args:
        PULL_FROM_LOCAL: ${PULL_FROM_LOCAL:-0}
        BRANCH: ${BRANCH:-main}
        CACHEBUST: ${CACHEBUST:-none}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 8g
    volumes:
      # SAM 3D Body checkpoints (required). Mount target = CHECKPOINTS_DIR_CONTAINER.
      - ${CHECKPOINTS_DIR:-./checkpoints}:${CHECKPOINTS_DIR_CONTAINER:-/fbxify/checkpoints}:ro
      # Optional: persistent caches (faster restarts, avoid re-downloads)
      - ${CACHE_DIR:-./cache}/videt_checkpoint:/root/.torch/iopath_cache/detectron2/ViTDet/COCO/cascade_mask_rcnn_vitdet_h/f328730692
      - ${CACHE_DIR:-./cache}/hf_cache:/root/.cache/huggingface
      - ${CACHE_DIR:-./cache}/mhr_assets:/fbxify/cache/mhr_assets
    environment:
      - CHECKPOINTS_DIR=${CHECKPOINTS_DIR_CONTAINER:-/fbxify/checkpoints}
      - CACHE_DIR=${CACHE_DIR_CONTAINER:-/fbxify/cache}
      - FBXIFY_MODEL=${FBXIFY_MODEL:-vith}
      - FBXIFY_SHARED_SECRET=${FBXIFY_SHARED_SECRET}
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  ui:
    image: mordommin94/fbxify-ui:latest
    build:
      context: ../..
      dockerfile: fbxify/docker/Dockerfile.ui
      args:
        PULL_FROM_LOCAL: ${PULL_FROM_LOCAL:-0}
        BRANCH: ${BRANCH:-main}
        CACHEBUST: ${CACHEBUST:-none}
    depends_on:
      worker:
        condition: service_healthy
    environment:
      - FBXIFY_REMOTE_WORKER_URL=http://worker:8000
      - FBXIFY_SHARED_SECRET=${FBXIFY_SHARED_SECRET}
      - REQUIRE_AUTH=${REQUIRE_AUTH}
      - FBXIFY_AUTH_CREDENTIALS=${FBXIFY_AUTH_CREDENTIALS}
      - FBXIFY_UI_PORT=${UI_PORT:-7444}
    ports:
      - "${UI_PORT:-7444}:${UI_PORT:-7444}"
